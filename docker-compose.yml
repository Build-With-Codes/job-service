services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiverse_jobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - job_service_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiverse_jobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  job-service-api:
    build: .
    command: sh -c "npm run prisma:migrate && npm run start:api"
    env_file: .env
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  job-service-worker:
    build: .
    command: npm run start:worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  job-service-scheduler:
    build: .
    command: npm run start:scheduler
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  job_service_postgres:
